<div class="modal-component" *ngIf="item">
  <div class="modal-content">
    <div class="modal-header">
      <h3>{{ title }}</h3>
    </div>
    <form (ngSubmit)="onSubmit()" class="modal-form">
      <div *ngFor="let field of fields" class="form-group">
        <label>{{ field.label }}:</label>
        <ng-container [ngSwitch]="field.type">

          <!-- Text input -->
          <input
            *ngSwitchCase="'text'"
            type="text"
            [(ngModel)]="item[field.key]"
            [name]="field.key"
            [readonly]="field.readonly"
            class="form-control"
            required
          />

          <!-- Number input -->
          <input
            *ngSwitchCase="'number'"
            type="number"
            [(ngModel)]="item[field.key]"
            [name]="field.key"
            [readonly]="field.readonly"
            step="0.01"
            class="form-control"
            required
          />

          <!-- Date input -->
          <input
            *ngSwitchCase="'date'"
            type="date"
            [(ngModel)]="item[field.key]"
            [name]="field.key"
            [readonly]="field.readonly"
            class="form-control"
            required
          />

          <!-- Textarea -->
          <textarea
            *ngSwitchCase="'textarea'"
            [(ngModel)]="item[field.key]"
            [name]="field.key"
            [readonly]="field.readonly"
            class="form-control"
            required
          ></textarea>

          <!-- Select / Dropdown -->
          <select
            *ngSwitchCase="'select'"
            [(ngModel)]="item[field.key]"
            [name]="field.key"
            [disabled]="!!field.readonly"
            class="form-control"
            required
            (change)="field.onChange?.(item[field.key])"
          >
            <option value="" disabled selected>-- Chọn {{ field.label }} --</option>
            <option
              *ngFor="let option of field.options"
              [ngValue]="option.value"
            >
              {{ option.label }}
            </option>
          </select>

        </ng-container>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn-save">Lưu</button>
        <button type="button" class="btn-cancel" (click)="onCancel()">
          Huỷ
        </button>
      </div>
    </form>
  </div>
</div>
